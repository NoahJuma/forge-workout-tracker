<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111310">
  <meta name="description" content="Your training, your way. Choose a plan, swap exercises, and build your own workouts with THE FORGE.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <script src="./theme.js"></script>
  <link rel="stylesheet" href="./styles.css">
  <title>THE FORGE · Your training, your way</title>
  <script src="./data.js" defer></script>
  <script src="./model.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to workout</a>
  <header class="app-header shell">
    <a class="brand" href="#workout" aria-label="The Forge home"><span class="brand-mark" aria-hidden="true">F</span><span>THE FORGE<small>BUILD YOUR EVERYDAY</small></span></a>
    <div class="header-actions">
      <button class="button subtle theme-toggle" id="themeToggle" type="button" aria-label="Switch to light mode" title="Switch to light mode"><span id="themeIcon" aria-hidden="true">☀</span><span class="theme-label" id="themeLabel">Light mode</span></button>
      <button class="button subtle" id="settingsBtn" title="Settings and backup">Settings</button>
    </div>
  </header>
  <main class="shell" id="main" tabindex="-1">
    <div class="welcome"><div><div class="eyebrow">YOUR SPACE TO GET STRONGER</div><h1>Make today count<span>.</span></h1><p>Your training, your pace. Let’s put in the work.</p></div><span class="local-label"><i></i> Saved on this device</span></div>
    <nav class="main-nav" aria-label="Main navigation">
      <button data-view="workout" aria-current="page">Workout</button>
      <button data-view="plans">Training plans</button>
      <button data-view="history">History</button>
    </nav>
    <div id="storageAlert" class="notice" role="alert" hidden></div>
    <section id="viewWorkout" aria-label="Your workout"></section>
    <section id="viewPlans" aria-label="Training plans" hidden></section>
    <section id="viewHistory" aria-label="Workout history" hidden></section>
    <p id="saveStatus" class="save-status" role="status">Your changes save automatically.</p>
    <footer>THE FORGE <span>Small steps. Stronger every session.</span></footer>
  </main>
  <dialog id="modal" aria-labelledby="modalTitle"><div id="modalContent"></div></dialog>
  <div id="toast" class="toast" role="status"></div>
  <noscript><p class="notice">Enable JavaScript to choose and log your workouts.</p></noscript>
</body>
</html>
